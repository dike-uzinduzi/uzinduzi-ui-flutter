name: uzinduzi_mobile_app
description: "Uzinduzi Africa — support African music, earn physical plaques."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State
  flutter_riverpod: ^2.6.1

  # HTTP + secure storage
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2

  # Media
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  http: ^1.2.2

  # Utils
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true