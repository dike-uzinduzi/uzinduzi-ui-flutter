name: uzinduzi_mobile_app
description: "Uzinduzi Africa — Launch Big, Grow Bigger. "
publish_to: 'none'

version: 0.0.0+1

environment:
  sdk: ^3.13.1
build_pipe:
  clean_flutter: true
  generate_log: true
  platforms:
    build_command: flutter build web
    add_version_query_param: true
dependencies:
  flutter:
    sdk: flutter
   
  cupertino_icons: ^1.0.8

  # State
  flutter_riverpod: ^2.6.1
  share_plus: ^10.1.1
  flutter_svg: ^2.0.10
  url_launcher: ^6.3.1
  
  # HTTP + secure storage
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2

  # Media
  cached_network_image: ^3.4.1
  image_picker: ^1.2.3
  http: ^1.2.2

  # Utils
  intl: ^0.20.2
  google_sign_in: ^7.2.0
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  google_sign_in_web: ^1.1.3
  smart_phone_field: ^2.2.1
  flutter_image_compress: ^2.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/icons/
    - assets/placeholders/