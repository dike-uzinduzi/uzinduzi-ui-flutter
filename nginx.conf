server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Gzip ──────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/wasm;
    gzip_min_length 1000;

    # ── Firebase Auth reverse proxy ───────────────────
    location /__/auth {
        proxy_pass https://uzinduziafrica-2223c.firebaseapp.com;
        proxy_http_version 1.1;
        proxy_set_header Host uzinduziafrica-2223c.firebaseapp.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        proxy_ssl_name uzinduziafrica-2223c.firebaseapp.com;
    }

    # ── Root entry point: never cache ─────────────────
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    location = /version.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # ── Placeholders: stable path at container root ───
    # Served from /usr/share/nginx/html/placeholders/ (copied by Dockerfile)
    location /placeholders/ {
        expires 7d;
        add_header Cache-Control "public" always;
        try_files $uri =404;
    }

    # ── Service worker path: hard 404 ─────────────────
    location = /flutter_service_worker.js {
        return 404;
    }

    # ── Health check ──────────────────────────────────
    location = /health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # ── Versioned assets: cache forever, immutable ────
    location ~ ^/[0-9]+\.[0-9]+\.[0-9]+/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri $uri/ =404;
    }

    # ── SPA fallback ──────────────────────────────────
    # Serves index.html for / and any unmatched path.
    # Versioned assets matched above are unaffected.
    location / {
        try_files $uri $uri/ /index.html;
    }
}