server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Gzip ──────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/wasm;
    gzip_min_length 1000;

    # ── Firebase Auth reverse proxy ───────────────────
    # Must come before the SPA fallback so /__/auth/* is not
    # swallowed by location /.
    location /__/auth {
        proxy_pass https://uzinduziafrica-2223c.firebaseapp.com;
        proxy_http_version 1.1;
        proxy_set_header Host uzinduziafrica-2223c.firebaseapp.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        proxy_ssl_name uzinduziafrica-2223c.firebaseapp.com;
    }

    # ── HTML: never cache ─────────────────────────────
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }

    # ── Bootstrap + Flutter loader: never cache ───────
    location ~* ^/(flutter_bootstrap\.js|flutter\.js|main\.dart\.js|main\.dart\.js\.map)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        expires 0;
    }

    # ── Placeholders: 7 days ──────────────────────────
    location /placeholders/ {
        expires 7d;
        add_header Cache-Control "public" always;
        try_files $uri =404;
    }

    # ── Static assets: short TTL (Flutter doesn't hash) ──
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|wasm|css)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # ── SPA fallback ──────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Health check ──────────────────────────────────
    location /health {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}