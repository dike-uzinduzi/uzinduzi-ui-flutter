name: Build and Deploy Flutter Web

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Inject a unique cache-busting version into index.html ──
      # Rewrites flutter_bootstrap.js?v=... so every deploy fetches
      # a fresh bootstrap loader in the browser.
      - name: Inject cache-busting version into index.html
        run: |
          VERSION="$(date +%s)-${GITHUB_SHA::7}"
          sed -i "s|flutter_bootstrap.js?v=[^\"']*|flutter_bootstrap.js?v=${VERSION}|g" web/index.html
          echo "Injected version: ${VERSION}"
          grep flutter_bootstrap.js web/index.html

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          no-cache: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Trigger Dokploy redeploy
        run: |
          curl -X POST "${{ secrets.DOKPLOY_WEBHOOK_URL }}" \
            -H "Content-Type: application/json"